name: Deploy React Web Application to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: pawlife-web/package-lock.json

      - name: 3. Install Dependencies and Build Web Client
        run: |
          cd pawlife-web
          npm install
          npm run build
          # Prevent GitHub Pages from ignoring files or processing with Jekyll
          touch dist/.nojekyll
          # SPA routing fallback: copy index.html to 404.html
          cp dist/index.html dist/404.html

      - name: 4. Deploy to GitHub Pages Branch (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: pawlife-web/dist
          branch: gh-pages
