name: Deploy React Web Application to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: pawlife-web/package-lock.json

      - name: 3. Install Dependencies and Build Web Client
        run: |
          cd pawlife-web
          npm install
          npm run build

      - name: 4. Setup Pages
        uses: actions/configure-pages@v5

      - name: 5. Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pawlife-web/dist'

      - name: 6. Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
