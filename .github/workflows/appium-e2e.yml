name: Enterprise Appium Android E2E Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-android-e2e:
    name: Run Appium Android E2E Tests
    runs-on: macos-13
    timeout-minutes: 35

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Appium 2.x & UiAutomator2 Driver
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2

      - name: 6. Install Framework Dependencies
        run: |
          cd pawlife-mobile-e2e
          npm install

      - name: 7. Build Android APK
        run: |
          cd PawLife
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Start Android Emulator & Execute Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            echo "=== Starting Appium 2.x Server ==="
            appium --log /tmp/appium.log &
            sleep 6

            echo "=== Executing Appium E2E Automation Suites ==="
            cd pawlife-mobile-e2e
            export APK_PATH="../PawLife/app/build/outputs/apk/debug/app-debug.apk"
            export LAUNCH_MODE="apk"
            npm test

      - name: 9. Upload Mobile Excel Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-E2E-Excel-Report-${{ github.run_number }}
          path: pawlife-mobile-e2e/reports/excel/Mobile_E2E_Report.xlsx
          if-no-files-found: warn
          retention-days: 30

      - name: 10. Upload Mochawesome HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Mochawesome-HTML-Report-${{ github.run_number }}
          path: pawlife-mobile-e2e/reports/mochawesome/
          if-no-files-found: warn
          retention-days: 30

      - name: 11. Upload Failure Screenshots & Device Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Failures-And-Logcat-${{ github.run_number }}
          path: |
            pawlife-mobile-e2e/reports/failures/
            pawlife-mobile-e2e/logs/
            pawlife-mobile-e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 14
