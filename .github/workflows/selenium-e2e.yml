name: Enterprise Selenium E2E Test Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge

jobs:
  selenium-e2e:
    name: Run Selenium E2E Tests (${{ github.event.inputs.browser || 'chrome' }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            pawlife-e2e/package-lock.json
            pawlife-web/package-lock.json
            pawlife-server/package-lock.json

      - name: 3. Install Browser Drivers
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 4. Install Dependencies (Backend, Web & E2E)
        run: |
          echo "=== Installing pawlife-server dependencies ==="
          cd pawlife-server && npm install && npx prisma db push && npm run build
          cd ..
          echo "=== Installing pawlife-web dependencies ==="
          cd pawlife-web && npm install
          cd ..
          echo "=== Installing pawlife-e2e dependencies ==="
          cd pawlife-e2e && npm install

      - name: 5. Start Backend Server & Web Client
        run: |
          echo "=== Starting pawlife-server ==="
          cd pawlife-server && node dist/server.js &
          sleep 4
          curl --retry 5 --retry-delay 2 http://localhost:4000/api/health
          cd ..
          echo "=== Starting pawlife-web ==="
          cd pawlife-web && npm run dev -- --host &
          sleep 6
          curl --retry 5 --retry-delay 2 http://localhost:5173

      - name: 6. Execute Selenium E2E Automation Suites
        env:
          TEST_ENV: local
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:4000/api
          BROWSER: ${{ github.event.inputs.browser || 'chrome' }}
          HEADLESS: 'true'
          RETRIES: 1
        run: |
          cd pawlife-e2e
          npm test

      - name: 7. Upload Excel E2E Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Excel-Report-${{ github.run_number }}
          path: pawlife-e2e/reports/excel/E2E_Report.xlsx
          retention-days: 30

      - name: 8. Upload Mochawesome HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mochawesome-HTML-Report-${{ github.run_number }}
          path: pawlife-e2e/reports/mochawesome/
          retention-days: 30

      - name: 9. Upload Failure Screenshots & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostic-Failures-And-Logs-${{ github.run_number }}
          path: |
            pawlife-e2e/reports/failures/
            pawlife-e2e/logs/
          retention-days: 14
